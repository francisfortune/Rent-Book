    <style>
        :root {
            --main: purple;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
        }

        form h1 {
            font-family: 'Raleway Dots', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--main);
            margin-bottom: 20px;
        }

        .container {
            position: relative;
            width: 850px;
            height: 550px;
            background: #ffff;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, .2);
            margin: 20px;
            overflow: hidden;
        }

        .form-box {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;
            color: #333;
            text-align: center;
            padding: 40px;
            z-index: 1;
            transition: .6s ease-in-out 1.2s, visibility 0s 1s;
        }

        .container.active .form-box {
            right: 50%;
        }

        .form-box.register {
            visibility: hidden;
        }

        .container.active .form-box.register {
            visibility: visible;
        }

        .container.active .form-box.login {
            visibility: hidden;
        }

        form {
            width: 100%;
        }

        .container h1 {
            font-size: 36px;
            font-weight: bold;
            margin: -10px;
        }

        .input-box {
            position: relative;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            padding: 13px 50px 13px 20px;
            background: #eee;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }

        .input-box select {
            width: 100%;
            padding: 13px 50px 13px 20px;
            background: #eee;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 500;
            color: black;
            text-transform: capitalize;
        }

        .input-box select:hover {
            cursor: pointer;
        }

        input {
            color: navy;
        }

        .input-box option {
            position: absolute;
            color: black;
            font-weight: 400;
            font-size: 15px;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 99;
        }

        .input-box input::placeholder {
            color: black;
            font-weight: 400;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #333;
        }

        .forgot-link {
            margin: -25px 0 15px;
        }

        .forgot-link a {
            font-size: 14.5px;
            color: #333;
            text-decoration: none;
        }

        .btn {
            width: 100%;
            height: 48px;
            background: var(--main);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
            font-weight: 600;
        }

        .toggle-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .toggle-box::before {
            content: "";
            position: absolute;
            left: -250%;
            width: 300%;
            height: 100%;
            background-color: var(--main);
            /* border-radius: 120px; */
            z-index: 2;
            transition: 1.8s ease-in-out;
        }

        .container.active .toggle-box::before {
            left: 50%;
        }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: .6s ease-in-out;
            color: white;
        }

        .toggle-panel.toggle-left {
            left: 0;
            transition-delay: 1.2s;
        }

        .container.active .toggle-panel.toggle-left {
            left: -50%;
            transition-delay: .6s;
        }

        .toggle-panel.toggle-right {
            right: -50%;
            transition-delay: .6s;
        }

        .container.active .toggle-panel.toggle-right {
            right: 0;
            transition-delay: 1.2s;
        }

        .toggle-panel p {
            text-align: center;
            margin: 15px;
            font-size: 20px;
        }

        .toggle-panel h1 {
            color: whitesmoke;


        }

        .toggle-panel .btn {
            width: 260px;
            height: 46px;
            background: transparent;
            border: 2px solid #fff;
            box-shadow: none;
            border-radius: 20px;
        }

        /* Responsiveness */
        @media screen and (max-width: 650px) {

            .container {
                height: calc(100vh - 10px);
            }

            .toggle-panel .btn {
                width: 130px;
                height: 35px;
                background: transparent;
                border: 1px solid white;
                border-radius: 20px;
                font-size: 18px;
            }

            .form-box {
                bottom: 0;
                width: 100%;
                height: 70%;
            }

            .input-box {
                position: relative;
                margin: 20px 0;
            }

            .input-box input {
                width: 100%;
                padding: 10px 20px 10px 20px;
            }

            .container.active .form-box {
                right: 0;
                bottom: 30%;
            }

            .toggle-box::before {
                left: 0;
                top: -270%;
                width: 100%;
                height: 300%;
                /* border-radius: 20vw; */
            }

            .container.active .toggle-box::before {
                left: 0;
                top: 70%;
            }

            .forgot-link {
                margin-top: 2px;
            }

            .toggle-panel {
                width: 100%;
                height: 30%;
                gap: 16px;
            }

            .toggle-panel p {
                text-align: center;
                margin: 8px;
                font-size: 17px;
            }

            .toggle-panel h1 {
                color: white;
                font-size: 1.8rem;
            }

            .toggle-panel.toggle-left {
                top: 0;
            }

            .container.active .toggle-panel.toggle-right {
                bottom: 0;
            }

            .container.active .toggle-panel.toggle-left {
                left: 0;
                top: -30%;
                gap: 12px;
                margin-top: 40px;

            }

            .toggle-panel.toggle-right {
                right: 0;
                bottom: -30%;
            }

        }

        @media screen and (max-width: 400px) {

            .form-box {
                padding: 20px;
            }

            .toggle-panel h1 {
                font-size: 35px;
            }

        }

        /* ===============================
   PASSWORD VISIBILITY TOGGLE
   Remove this block if not needed
================================ */
.password-toggle {
    position: absolute;
    right: 45px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #555;
}

.password-toggle:hover {
    color: purple;
}

    </style>
</head>

<body>
    <div class="container">
        <!-- Register Form Box -->
        <div class="form-box login">
            <form id="registerForm">
                <h1>Register</h1>
                
                <!-- Email/Phone Auth Tab Selector -->
                <div class="flex justify-center gap-6 mb-4 border-b border-gray-100">
                    <button type="button" id="register-email-btn" class="register-tab-btn active border-b-2 border-purple-700 text-purple-700 pb-2 px-2 font-semibold text-sm transition-all" onclick="switchAuthMode('register', 'email')">Email Signup</button>
                    <button type="button" id="register-phone-btn" class="register-tab-btn text-gray-400 pb-2 px-2 font-semibold text-sm transition-all" onclick="switchAuthMode('register', 'phone')">Phone Signup</button>
                </div>

                <input type="hidden" id="registerAuthMethod" value="email">

                <!-- Shared User Name -->
                <div class="input-box" style="margin: 15px 0;">
                    <input type="text" name="registerName" id="registerName" placeholder="Business Owner Name" required>
                    <i class="fas fa-user"></i>
                </div>

                <!-- Email Fields Container -->
                <div id="registerEmailFields">
                    <div class="input-box" style="margin: 15px 0;">
                        <input type="email" id="registerEmail" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-box" style="margin: 15px 0;">
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('registerPassword', this)"></i>
                    </div>
                </div>

                <!-- Phone Fields Container -->
                <div id="registerPhoneFields" class="hidden">
                    <div class="flex gap-2 mb-3">
                        <select id="registerCountryCode" class="p-3 bg-gray-100 rounded-lg outline-none text-sm font-semibold border-r" style="width: 30%; height: 48px; border: none; border-radius: 8px;">
                            <option value="+234">+234 (NG)</option>
                            <option value="+1">+1 (US)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+91">+91 (IN)</option>
                        </select>
                        <input type="tel" id="registerPhone" class="p-3 bg-gray-100 rounded-lg outline-none text-sm font-medium" placeholder="Phone Number" style="width: 70%; height: 48px; border: none; border-radius: 8px;">
                    </div>
                    <button type="button" id="sendRegisterOtpBtn" class="w-full bg-purple-100 text-purple-700 py-2.5 rounded-lg text-xs font-bold hover:bg-purple-200 transition shadow-sm mb-4">Send Verification SMS</button>
                    
                    <div id="registerOtpContainer" class="hidden">
                        <div class="input-box" style="margin: 15px 0;">
                            <input type="text" id="registerOtp" placeholder="6-Digit OTP Code">
                            <i class="fas fa-key"></i>
                        </div>
                    </div>
                </div>

                <div class="forgot-link" style="margin-top: 10px; margin-bottom: 15px;">
                    <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                    <label for="terms" class="form-check-label text-xs">I agree to the
                        <a href="terms.html" style="color: purple; font-weight: 600;">Terms & Conditions</a>
                    </label>
                </div>
                <button type="submit" class="btn">Register</button>

                <div class="flex items-center my-3">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-3 text-gray-400 text-xs font-semibold uppercase tracking-wider">Or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <button type="button" id="googleSignUp"
                    class="w-full flex items-center justify-center gap-2 py-3 border border-gray-200 rounded-lg bg-white hover:bg-gray-50 transition-all font-medium text-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16"
                        alt="Google Logo">
                    Continue with Google
                </button>
            </form>
        </div>

        <!-- Login Form Box -->
        <div class="form-box register">
            <form id="loginForm">
                <h1>Login</h1>

                <!-- Email/Phone Auth Tab Selector -->
                <div class="flex justify-center gap-6 mb-4 border-b border-gray-100">
                    <button type="button" id="login-email-btn" class="login-tab-btn active border-b-2 border-purple-700 text-purple-700 pb-2 px-2 font-semibold text-sm transition-all" onclick="switchAuthMode('login', 'email')">Email Login</button>
                    <button type="button" id="login-phone-btn" class="login-tab-btn text-gray-400 pb-2 px-2 font-semibold text-sm transition-all" onclick="switchAuthMode('login', 'phone')">Phone Login</button>
                </div>

                <input type="hidden" id="loginAuthMethod" value="email">

                <!-- Email Fields Container -->
                <div id="loginEmailFields">
                    <div class="input-box" style="margin: 15px 0;">
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-box" style="margin: 15px 0;">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword', this)"></i>
                    </div>
                </div>

                <!-- Phone Fields Container -->
                <div id="loginPhoneFields" class="hidden">
                    <div class="flex gap-2 mb-3">
                        <select id="loginCountryCode" class="p-3 bg-gray-100 rounded-lg outline-none text-sm font-semibold border-r" style="width: 30%; height: 48px; border: none; border-radius: 8px;">
                            <option value="+234">+234 (NG)</option>
                            <option value="+1">+1 (US)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+91">+91 (IN)</option>
                        </select>
                        <input type="tel" id="loginPhone" class="p-3 bg-gray-100 rounded-lg outline-none text-sm font-medium" placeholder="Phone Number" style="width: 70%; height: 48px; border: none; border-radius: 8px;">
                    </div>
                    <button type="button" id="sendLoginOtpBtn" class="w-full bg-purple-100 text-purple-700 py-2.5 rounded-lg text-xs font-bold hover:bg-purple-200 transition shadow-sm mb-4">Send Verification SMS</button>
                    
                    <div id="loginOtpContainer" class="hidden">
                        <div class="input-box" style="margin: 15px 0;">
                            <input type="text" id="loginOtp" placeholder="6-Digit OTP Code">
                            <i class="fas fa-key"></i>
                        </div>
                    </div>
                </div>

                <div class="forgot-link" style="margin-top: 10px; margin-bottom: 15px;">
                    <a href="#" id="forgotPassword" class="text-xs text-purple-700 font-semibold">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>

                <div class="flex items-center my-3">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-3 text-gray-400 text-xs font-semibold uppercase tracking-wider">Or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <button type="button" id="googleLogin"
                    class="w-full flex items-center justify-center gap-2 py-3 border border-gray-200 rounded-lg bg-white hover:bg-gray-50 transition-all font-medium text-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" height="16"
                        alt="Google Logo">
                    Continue with Google
                </button>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Already have an Account?</p>
                <button class="btn register-btn">Login</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Hello, Welcome?</h1>
                <p>Don't have an Account?</p>
                <button class="btn login-btn">Register</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.querySelector(".container");
        const registerBtn = document.querySelector(".register-btn");
        const loginBtn = document.querySelector(".login-btn");

        registerBtn.addEventListener("click", () => {
            container.classList.add("active");
        });

        loginBtn.addEventListener("click", () => {
            container.classList.remove("active");
        });
    /* =====================================
   PASSWORD VISIBILITY TOGGLE FUNCTION
   You can safely DELETE this function
   if you remove the eye icons
===================================== */
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
document.addEventListener("DOMContentLoaded", () => {

  const resetModal = document.getElementById("resetModal");
  const forgotPassword = document.getElementById("forgotPassword");
  const closeReset = document.getElementById("closeReset");

  if (!resetModal || !forgotPassword || !closeReset) {
    console.error("Reset modal elements not found");
    return;
  }

  forgotPassword.addEventListener("click", (e) => {
    e.preventDefault();
    resetModal.classList.remove("hidden");
    resetModal.classList.add("flex");
  });

  closeReset.addEventListener("click", () => {
    resetModal.classList.add("hidden");
  });

});
function switchAuthMode(formType, mode) {
  const emailFields = document.getElementById(formType + 'EmailFields');
  const phoneFields = document.getElementById(formType + 'PhoneFields');
  const emailInput = document.getElementById(formType === 'register' ? 'registerEmail' : 'loginEmail');
  const passwordInput = document.getElementById(formType === 'register' ? 'registerPassword' : 'loginPassword');
  const phoneInput = document.getElementById(formType === 'register' ? 'registerPhone' : 'loginPhone');

  // Toggle active button styles
  const buttons = document.querySelectorAll(`.${formType}-tab-btn`);
  buttons.forEach(btn => {
    btn.classList.remove('active', 'border-b-2', 'border-purple-700', 'text-purple-700');
    btn.classList.add('text-gray-400');
  });

  const activeBtn = document.getElementById(`${formType}-${mode}-btn`);
  if (activeBtn) {
    activeBtn.classList.add('active', 'border-b-2', 'border-purple-700', 'text-purple-700');
    activeBtn.classList.remove('text-gray-400');
  }

  if (mode === 'email') {
    if (emailFields) emailFields.classList.remove('hidden');
    if (phoneFields) phoneFields.classList.add('hidden');
    if (emailInput) emailInput.required = true;
    if (passwordInput) passwordInput.required = true;
    if (phoneInput) phoneInput.required = false;
    document.getElementById(formType + 'AuthMethod').value = 'email';
  } else {
    if (emailFields) emailFields.classList.add('hidden');
    if (phoneFields) phoneFields.classList.remove('hidden');
    if (emailInput) emailInput.required = false;
    if (passwordInput) passwordInput.required = false;
    if (phoneInput) phoneInput.required = true;
    document.getElementById(formType + 'AuthMethod').value = 'phone';
  }
}
</script>
<div id="recaptcha-container"></div>

    <!-- RESET PASSWORD MODAL -->
<div id="resetModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">

  <div class="bg-white p-6 rounded-xl w-80 shadow-lg text-center">

    <h2 class="text-xl font-semibold mb-3">Reset Password</h2>

    <p class="text-sm text-gray-500 mb-4">
      Enter your account email and we’ll send you a reset link.
    </p>

    <input
      type="email"
      id="resetEmail"
      placeholder="Enter your email"
      class="w-full p-3 border rounded-lg mb-4"
    >

    <button
      id="sendReset"
      class="w-full bg-purple text-white py-2 rounded-lg mb-2" style="background-color: var(--main);"
    >
      Send Reset Link
    </button>

    <button
      id="closeReset"
      class="text-sm text-gray-500"
    >
      Cancel
    </button>

  </div>

</div>
